{% extends 'shared/base.html' %}
{% block title %}Delete {{ object.name }} | Farmers Market{% endblock %}

{% block content %}
<div class="fm-card fm-form-card fm-danger-card">
    <div class="fm-form-head">
        <h1 class="h3 mb-1"><i class="fa-solid fa-triangle-exclamation me-2"></i>Delete Product</h1>
        <p class="mb-0">This action cannot be undone.</p>
    </div>
    <form method="post" class="fm-form-body">
        {% csrf_token %}
        <p class="fs-5 mb-4">Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
        <div class="d-flex justify-content-between gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
            <button class="btn btn-danger btn-lg" type="submit"><i class="fa-solid fa-trash me-1"></i> Delete</button>
        </div>
    </form>
</div>
{% endblock %}
