{% extends 'shared/base.html' %}
{% block content %}
<div class="container">
    <h2 class="mt-4">Delete Product</h2>
    <form method="post" class="mt-4" action="#" enctype="multipart/form-data">
        {% csrf_token %}
        <p>Are you sure you want to delete this product?</p>
        {{ form.as_p }}
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">← Back</a>
        <button class="btn btn-primary btn-lg btn-danger" type="submit">Delete</button>
    </form>
</div>
{% endblock %}
