{% load crispy_forms_filters %}
{# Usage: {% include 'shared/form-card.html' with title="..." subtitle="..." icon="fa-..." submit_label="..." %} #}
<div class="fm-card fm-form-card">
    <div class="fm-form-head">
        <h1 class="h3 mb-1"><i class="fa-solid {{ icon }} me-2"></i>{{ title }}</h1>
        {% if subtitle %}<p class="text-muted mb-0">{{ subtitle }}</p>{% endif %}
    </div>
    <form method="post" enctype="multipart/form-data" class="fm-form-body">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex justify-content-between gap-2 pt-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check me-1"></i> {{ submit_label }}</button>
        </div>
    </form>
</div>
